name: 'Build SeedSigner OS for La Frite'

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      app_repo:
        description: 'SeedSigner app repository URL'
        required: false
        default: 'https://github.com/3rdIteration/seedsigner'
      app_branch:
        description: 'SeedSigner app branch'
        required: false
        default: 'dev'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SeedSigner OS for La Frite (AML-S805X-AC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout seedsigner-os repository
        uses: actions/checkout@v4
        with:
          repository: 3rdIteration/seedsigner-os
          ref: main
          submodules: recursive

      - name: Free disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h

          sudo rm -rf \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk \
            /usr/share/dotnet
          sudo apt-get clean
          docker system prune --all --force || true

          echo "Disk usage after cleanup:"
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-lafrite-smartcard-dev-${{ github.sha }}
          restore-keys: |
            ccache-lafrite-smartcard-dev-

      - name: Create required directories
        run: |
          mkdir -p images
          mkdir -p buildroot_dl

      - name: Build SeedSigner OS for La Frite
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
          SS_ARGS: >-
            --lafrite
            --smartcard
            --dev
            --app-repo=${{ inputs.app_repo || 'https://github.com/3rdIteration/seedsigner' }}
            --app-branch=${{ inputs.app_branch || 'dev' }}
        run: docker compose up --force-recreate --build --exit-code-from build-images

      - name: Upload seedsigner-os La Frite image artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: seedsigner-os-lafrite-smartcard-dev
          path: images/seedsigner_os.*.img
          retention-days: 7
          if-no-files-found: warn
