name: Build Radxa Zero 3E Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'configs/radxa_zero3e_defconfig'
      - 'board/radxa/zero3e/**'
      - '.github/workflows/radxa-zero3e-build.yml'
  pull_request:
    paths:
      - 'configs/radxa_zero3e_defconfig'
      - 'board/radxa/zero3e/**'
      - '.github/workflows/radxa-zero3e-build.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Radxa Zero 3E Buildroot Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            build-essential \
            cpio \
            file \
            git \
            libncurses-dev \
            libssl-dev \
            rsync \
            unzip \
            wget

      - name: Build image
        run: |
          make radxa_zero3e_defconfig
          make

      - name: Upload SD card image
        uses: actions/upload-artifact@v4
        with:
          name: radxa-zero3e-sdcard-image
          path: output/images/sdcard.img
          if-no-files-found: error
